title: TanmayLabs
description: Sharing thoughts on tech, life, and everything in between
baseurl: ""
url: "https://blog.tanmaylabs.me"
author:
  name: Tanmay Jain
  email: tanmay5tj@gmail.com

markdown: kramdown
highlighter: rouge
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

paginate: 5
paginate_path: "/page:num/"

collections:
  posts:
    output: true
    permalink: /:categories/:year/:month/:day/:title/

navigation:
  - title: Home
    url: /
  - title: Topics
    url: /topics/
  - title: Search
    url: /search/
  - title: About
    url: /about/

social:
  github: tanmaydoesai
  linkedin: tanmaydoesai

# 2026-10-25: no CSS source maps in the public build (main.css.map was served publicly).
sass:
  sourcemap: never

# 2026-10-25: keep repo/ops files out of _site (readme.md and docker-compose.dev.yml were served publicly).
exclude:
  - Gemfile
  - Gemfile.lock
  - docker-compose.yml
  - docker-compose.dev.yml
  - "docker-compose*.yml"
  - README.md
  - readme.md
  - "*.bak-*"
  - "*.map"
  - vendor/
