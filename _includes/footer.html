<footer class="site-footer h-card">
<data class="u-url" href="{{ "/" | relative_url }}"></data>

<div class="wrapper">

    <div class="footer-col-wrapper">
    <div class="footer-col footer-col-1">
        <h2 class="footer-heading">{{ site.title | escape }}</h2>
        <p>{{ site.description | escape }}</p>
    </div>

    <div class="footer-col footer-col-2">
        <ul class="social-media-list">
        {% if site.social.github %}
            <li>
            <a href="https://github.com/{{ site.social.github | cgi_escape | escape }}" target="_blank" rel="noopener noreferrer">
                <svg class="svg-icon"><use xlink:href="/assets/minima-social-icons.svg#github"></use></svg> <span class="username">{{ site.social.github | escape }}</span>
            </a>
            </li>
        {% endif %}
        {% if site.social.linkedin %}
            <li>
            <a href="https://www.linkedin.com/in/{{ site.social.linkedin | cgi_escape | escape }}" target="_blank" rel="noopener noreferrer">
                <svg class="svg-icon"><use xlink:href="/assets/minima-social-icons.svg#linkedin"></use></svg> <span class="username">{{ site.social.linkedin | escape }}</span>
            </a>
            </li>
        {% endif %}
        </ul>
    </div>
    </div>

</div>

</footer>
